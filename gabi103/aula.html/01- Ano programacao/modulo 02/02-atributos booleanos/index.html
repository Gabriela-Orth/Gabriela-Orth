    <h1>Como funcionam</h1>

        <p>Presença significa verdadeiro: Se o atributo está escrito na tag, o seu valor é considerado true.</p>
        <br>
        <p>Ausência significa falso: Se o atributo não está na tag, o valor é considerado false.</p><br>
        <p>Exemplos comuns: disabled, checked, required, readonly e autofocus.</p>
